<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101319"><title>高校テスト日程</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#101319;color:#f4f6fa}main{max-width:650px;margin:auto;padding:24px 16px 90px}h1{font-size:23px;margin:4px 0 20px}h2{font-size:16px;margin:24px 0 12px}.muted,small{color:#a9b1c1}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.panel,.item{background:#1d222b;border:1px solid #303744;border-radius:14px;padding:16px}.num{font-size:29px;font-weight:800;margin:6px 0}.item{margin:10px 0}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.pill{background:#243c62;color:#a8caff;padding:5px 9px;border-radius:20px;font-size:12px}.danger{background:#552a30;color:#ffb7bf}.warn{background:#59452a;color:#ffda9c}button,input,textarea{font:inherit}button{border:0;border-radius:9px;background:#3178f6;color:white;padding:10px 13px;cursor:pointer}button.secondary{background:#343c49}button.remove{background:#63333b}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #89b6ff}input,textarea{width:100%;background:#141820;color:white;border:1px solid #4c5667;border-radius:9px;padding:11px;margin:6px 0 12px}label{display:block;font-size:13px;color:#cbd1dd}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.bar{height:9px;background:#343d4a;border-radius:10px;overflow:hidden;margin-top:8px}.fill{height:100%;background:#4b91ff}dialog{background:#202631;color:white;border:1px solid #465163;border-radius:16px;width:min(95vw,460px);padding:20px}dialog::backdrop{background:#000b}.section{display:flex;justify-content:space-between;align-items:center;gap:8px}footer{margin-top:25px;font-size:12px;color:#a9b1c1}#file{display:none}</style></head><body><main><h1>📚 高校テスト日程</h1><div class="stats"><div class="panel"><small>登録科目数</small><div class="num" id="count">0</div></div><div class="panel"><small>最初のテストまで</small><div class="num" id="next">—</div></div></div><div class="section"><h2>科目一覧</h2><button id="add">＋ 追加</button></div><div id="list"></div><h2>バックアップ</h2><div class="actions"><button class="secondary" id="export">データを書き出す</button><button class="secondary" id="import">データを読み込む</button><input id="file" type="file" accept="application/json,.json"></div><footer>データはこの端末のブラウザに保存されます。ブラウザのデータ削除や機種変更で消える場合があるので、定期的にバックアップしてください。共有URLにはあなたの予定は含まれません。</footer></main><dialog id="dialog"><form id="form"><h2 id="formtitle">テストを追加</h2><label>科目名<input name="subject" required maxlength="50" placeholder="例：数学"></label><label>テスト日<input name="date" type="date" required></label><label>テスト範囲<textarea name="range" rows="2" maxlength="500" placeholder="例：教科書 p.80〜120"></textarea></label><label>メモ<textarea name="memo" rows="2" maxlength="500"></textarea></label><label><input name="done" type="checkbox" style="width:auto;margin-right:8px">勉強完了</label><div class="actions"><button type="submit">保存</button><button type="button" class="secondary" id="cancel">キャンセル</button></div></form></dialog><script>
const KEY='exam-manager-v1';let entries=[];let editing=null;const $=id=>document.getElementById(id);const today=()=>{let d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};const days=s=>{const [y,m,d]=s.split('-').map(Number);return Math.round((new Date(y,m-1,d)-today())/86400000)};function load(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');entries=Array.isArray(a)?a:[]}catch{entries=[]}}function save(){localStorage.setItem(KEY,JSON.stringify(entries));render()}function elt(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}function render(){const list=$('list');list.replaceChildren();entries.sort((a,b)=>a.date.localeCompare(b.date));$('count').textContent=entries.length;const future=entries.filter(x=>days(x.date)>=0);$('next').textContent=future.length?days(future[0].date)+'日':'—';if(!entries.length){list.append(elt('p','muted','まだテストがありません。「＋ 追加」から登録しよう。'));return}const pct=Math.round(entries.filter(x=>x.done).length/entries.length*100);const summary=elt('div','panel');summary.append(elt('div','','全体の勉強進捗 '+pct+'%'));const bar=elt('div','bar');const fill=elt('div','fill');fill.style.width=pct+'%';bar.append(fill);summary.append(bar);list.append(summary);for(const x of entries){const item=elt('article','item');const top=elt('div','top');top.append(elt('strong','',x.subject));const n=days(x.date);top.append(elt('span','pill '+(n<=3?'danger':n<=7?'warn':''),n<0?'終了':n===0?'今日':`あと ${n} 日`));item.append(top);item.append(elt('p','muted','📅 '+x.date));if(x.range)item.append(elt('p','','範囲：'+x.range));if(x.memo)item.append(elt('p','muted','メモ：'+x.memo));const acts=elt('div','actions');const toggle=elt('button',x.done?'secondary':'',x.done?'✓ 勉強完了':'勉強完了にする');toggle.onclick=()=>{x.done=!x.done;save()};const edit=elt('button','secondary','編集');edit.onclick=()=>openForm(x);const del=elt('button','remove','削除');del.onclick=()=>{if(confirm(x.subject+'を削除しますか？')){entries=entries.filter(e=>e.id!==x.id);save()}};acts.append(toggle,edit,del);item.append(acts);list.append(item)}}function openForm(x){editing=x?.id??null;const f=$('form');f.reset();f.elements.subject.value=x?.subject||'';f.elements.date.value=x?.date||'';f.elements.range.value=x?.range||'';f.elements.memo.value=x?.memo||'';f.elements.done.checked=!!x?.done;$('formtitle').textContent=x?'テストを編集':'テストを追加';$('dialog').showModal()}$('add').onclick=()=>openForm();$('cancel').onclick=()=>$('dialog').close();$('form').onsubmit=e=>{e.preventDefault();const f=e.currentTarget;const obj={id:editing??(crypto.randomUUID?.()||String(Date.now())),subject:f.elements.subject.value.trim(),date:f.elements.date.value,range:f.elements.range.value.trim(),memo:f.elements.memo.value.trim(),done:f.elements.done.checked};if(!obj.subject||!obj.date)return;if(editing){entries=entries.map(x=>x.id===editing?obj:x)}else entries.push(obj);save();$('dialog').close()};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(entries,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='テスト管理バックアップ.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const a=JSON.parse(await f.text());if(!Array.isArray(a)||!a.every(x=>x&&typeof x.subject==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)))throw Error('形式が違います');if(confirm('現在の予定をバックアップの内容で置き換えますか？')){entries=a.map(x=>({id:String(x.id||Math.random()),subject:x.subject,date:x.date,range:String(x.range||''),memo:String(x.memo||''),done:!!x.done}));save()}}catch{alert('読み込めないファイルです')}e.target.value=''};load();render();
</script></body></html>
