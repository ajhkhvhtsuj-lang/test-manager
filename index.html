<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高校テスト管理</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}body{margin:0;background:#0e1118;color:#f2f5fb}main{max-width:850px;margin:auto;padding:18px}h1{font-size:1.5rem}h2{font-size:1.12rem}.panel{background:#1b222e;border:1px solid #364151;border-radius:15px;padding:16px;margin:15px 0}.muted{color:#abb7ca;font-size:.88rem}button,.button{border:0;border-radius:9px;background:#3175f4;color:white;padding:11px 15px;font:inherit;cursor:pointer;display:inline-block}button.secondary{background:#384457}button.danger{background:#933b48}button:disabled{opacity:.55}input,textarea,select{box-sizing:border-box;width:100%;border:1px solid #526078;border-radius:8px;background:#111925;color:white;padding:10px;font:inherit}label{display:block;font-size:.9rem;margin:10px 0 5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.entry{border:1px solid #445168;border-radius:10px;padding:12px;margin:10px 0}.filelist{overflow-wrap:anywhere}.hidden{display:none}#status{white-space:pre-wrap}.pill{font-size:.78rem;color:#cbd6e7}hr{border:0;border-top:1px solid #354154;margin:18px 0}
</style></head><body><main>
<h1>📚 高校テスト管理</h1><p class="muted">写真から日程と範囲を読み取り、確認して登録できます。データはこのブラウザに保存されます。</p>
<section class="panel"><h2>📸 複数写真を読み取る</h2><p class="muted">日程表・範囲表などをまとめて選択。枚数の固定上限はありません（端末のメモリによる制限はあります）。</p><input id="photos" type="file" accept="image/*" multiple><div id="files" class="filelist muted"></div><div class="actions"><button id="read">写真を読み取る</button><button id="manual" class="secondary">手入力で追加</button></div><p id="status" role="status" aria-live="polite" class="muted"></p><details><summary>読み取った文章を確認・修正</summary><p class="muted">認識結果が間違っている場合、文章を直して「文章から候補を作成」を押してください。</p><textarea id="raw" rows="9" placeholder="科目名、日程、問題番号など"></textarea><div class="actions"><button id="parse" class="secondary">文章から候補を作成</button></div></details></section>
<section class="panel"><h2>登録前の確認・修正</h2><p class="muted">科目名が一致した候補だけを自動統合します。別表で科目名がない場合は手動で合わせてください。誤認識がないか必ず確認してください。</p><div id="candidates"></div><div class="actions"><button id="save">確認した候補を一括登録</button><button id="clearCandidates" class="secondary">候補をクリア</button></div></section>
<section class="panel"><h2>登録済みのテスト</h2><div id="saved"></div><hr><h2>バックアップ</h2><div class="actions"><button id="export" class="secondary">データを書き出す</button><label class="button secondary" style="margin:0">データを読み込む<input id="import" type="file" accept="application/json,.json" hidden></label></div></section>
</main>
<script>
'use strict';
const KEY='exam-manager-v2';
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let entries=[];try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');entries=Array.isArray(v)?v:[]}catch{}
let candidates=[];
const clean=s=>String(s||'').normalize('NFKC').replace(/[ \t　]/g,'').toLowerCase();
const aliases=[['論理・表現','論理表現','論表'],['英語コミュニケーション','英コミ','英語コミュ'],['数学i','数学1','数i','数1'],['数学ii','数学2','数ii','数2'],['数学a','数a'],['数学b','数b'],['現代の国語','現国'],['言語文化','言文'],['古典探究','古典'],['化学基礎','化基'],['生物基礎','生基'],['物理基礎','物基'],['歴史総合','歴総'],['地理総合','地総']];
function canonical(s){let n=clean(s).replace(/[・･]/g,'');for(const a of aliases){if(a.some(x=>clean(x).replace(/[・･]/g,'')===n))return clean(a[0])}return n}
function addCandidate(c){const name=(c.subject||'').trim(),key=canonical(name);if(key){let existing=candidates.find(x=>canonical(x.subject)===key);if(existing){for(const k of ['date','range','material','notes'])if(c[k]&&!existing[k])existing[k]=c[k];return}}candidates.push({subject:name,date:c.date||'',range:c.range||'',material:c.material||'',notes:c.notes||''})}
const subjects=['論理・表現','英語コミュニケーション','数学Ⅰ','数学Ⅱ','数学A','数学B','現代の国語','言語文化','古典探究','化学基礎','生物基礎','物理基礎','歴史総合','地理総合','情報Ⅰ','公共','家庭基礎','保健','体育','英語','国語','数学','化学','生物','物理','日本史','世界史','地理','情報'];
function subjectIn(line){let t=clean(line);for(const s of [...subjects].sort((a,b)=>b.length-a.length)){if(t.includes(clean(s)))return s}return ''}
function dateIn(line){const m=line.match(/(?:20\d{2}[\/.-])?(\d{1,2})\s*[\/月.-]\s*(\d{1,2})\s*日?/);return m?`${m[1]}/${m[2]}`:''}
function rangeIn(line){let m=line.match(/(?:問題番号|問題|問)\s*[：:]?\s*(\d{1,5})\s*[〜~～\-－ー]\s*(\d{1,5})/);if(!m)m=line.match(/\b(\d{3,5})\s*[〜~～\-－ー]\s*(\d{3,5})\b/);return m?`${m[1]}〜${m[2]}`:''}
function parseText(raw){const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let current='';let anonymous=[];let found=0;for(let i=0;i<lines.length;i++){const line=lines[i];const subj=subjectIn(line);if(subj)current=subj;const date=dateIn(line),range=rangeIn(line);if(!subj&&!date&&!range)continue;if(subj||date||range){const obj={subject:subj||current,date,range,material:/vintage/i.test(line)?'Vintage':'',notes:''};if(obj.subject)addCandidate(obj);else anonymous.push(obj);found++}}
if(anonymous.length){for(const a of anonymous)addCandidate({...a,notes:'科目を確認してください（元の表に科目名がありません）'})}
if(!found&&raw.trim())addCandidate({subject:'',notes:'読み取り文章を確認し、科目・日程・範囲を入力してください'});
renderCandidates();return found}
function field(i,key,label,placeholder=''){return `<label for="c-${i}-${key}">${label}</label><input id="c-${i}-${key}" data-i="${i}" data-key="${key}" value="${escapeHTML(candidates[i][key])}" placeholder="${escapeHTML(placeholder)}">`}
function renderCandidates(){ $('candidates').innerHTML=candidates.length?candidates.map((c,i)=>`<div class="entry"><div class="grid"><div>${field(i,'subject','科目名','例：論理・表現')}</div><div>${field(i,'date','テスト日','例：11/20')}</div><div>${field(i,'range','範囲','例：問題1124〜1156')}</div><div>${field(i,'material','教材','例：Vintage')}</div></div>${field(i,'notes','メモ')}<div class="actions"><button class="secondary" data-merge="${i}">別候補と統合</button><button class="danger" data-remove="${i}">削除</button></div></div>`).join(''):'<p class="muted">候補はまだありません。</p>'}
$('candidates').addEventListener('input',e=>{const t=e.target;if(t.dataset.key)candidates[+t.dataset.i][t.dataset.key]=t.value});
$('candidates').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.remove!==undefined){candidates.splice(+b.dataset.remove,1);renderCandidates()}else if(b.dataset.merge!==undefined){const i=+b.dataset.merge;if(candidates.length<2)return alert('統合する候補がありません');const list=candidates.map((x,j)=>`${j+1}: ${x.subject||'科目未設定'} / ${x.date||'-'} / ${x.range||'-'}`).join('\n');const n=Number(prompt('統合先の番号を入力してください。\n'+list));const j=n-1;if(!Number.isInteger(n)||j<0||j>=candidates.length||j===i)return;const from=candidates[i],to=candidates[j];for(const k of ['subject','date','range','material','notes'])if(from[k]&&!to[k])to[k]=from[k];candidates.splice(i,1);renderCandidates()}});
$('manual').onclick=()=>{addCandidate({});renderCandidates()};$('clearCandidates').onclick=()=>{candidates=[];renderCandidates()};
$('parse').onclick=()=>{const n=parseText($('raw').value);$('status').textContent=`文章を解析しました（該当行 ${n} 件）。内容を確認してください。`};
$('photos').onchange=()=>{$('files').textContent=[...$('photos').files].map(f=>f.name).join('、')};
$('read').onclick=async()=>{const files=[...$('photos').files];if(!files.length)return alert('写真を選択してください');$('read').disabled=true;$('status').textContent='写真を読み取っています。画面を閉じずにお待ちください。';try{if(!window.Tesseract){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=resolve;s.onerror=()=>reject(Error('文字認識ライブラリを読み込めませんでした'));document.head.appendChild(s)})}const worker=await Tesseract.createWorker('jpn+eng');let all='';try{for(const file of files){if(!file.type.startsWith('image/'))continue;const {data}=await worker.recognize(file);all+=`\n【${file.name}】\n${data.text}\n`}}finally{await worker.terminate()}$('raw').value=all;const n=parseText(all);$('status').textContent=`${files.length}枚の読み取りが完了しました。候補の内容を確認・修正してください（該当行 ${n} 件）。科目と範囲が別行・別写真の場合は手動統合が必要なことがあります。`}catch(err){$('status').textContent='読み取りに失敗しました: '+err.message}finally{$('read').disabled=false}};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(entries));return true}catch(e){alert('保存できませんでした。ブラウザの保存容量を確認してください。');return false}}
$('save').onclick=()=>{if(!candidates.length)return alert('登録候補がありません');if(candidates.some(c=>!c.subject.trim()))return alert('科目名が空欄の候補があります。確認してください');const now=Date.now();entries.push(...candidates.map((c,i)=>({...c,id:`${now}-${i}`})));if(persist()){candidates=[];renderCandidates();renderSaved();alert('登録しました')}};
function renderSaved(){$('saved').innerHTML=entries.length?entries.map((c,i)=>`<div class="entry"><strong>${escapeHTML(c.subject)}</strong><p>${escapeHTML(c.date||'日付未設定')}　${escapeHTML(c.material||'')}</p><p>範囲：${escapeHTML(c.range||'未設定')}</p>${c.notes?`<p class="muted">${escapeHTML(c.notes)}</p>`:''}<button class="danger" data-delete="${i}">削除</button></div>`).join(''):'<p class="muted">まだ登録されていません。</p>'}
$('saved').onclick=e=>{const b=e.target.closest('[data-delete]');if(!b)return;if(confirm('このテストを削除しますか？')){entries.splice(+b.dataset.delete,1);persist();renderSaved()}};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(entries,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='test-manager-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data)||data.some(x=>typeof x!=='object'||x===null))throw Error('形式が違います');if(!confirm('現在の登録データをバックアップの内容で置き換えますか？'))return;entries=data.map(x=>({subject:String(x.subject||''),date:String(x.date||''),range:String(x.range||''),material:String(x.material||''),notes:String(x.notes||''),id:String(x.id||Date.now())}));persist();renderSaved()}catch(err){alert('読み込みに失敗しました: '+err.message)}finally{e.target.value=''}};
renderCandidates();renderSaved();
</script></body></html>
